name = "biodigital"
pages_build_output_dir = "./web/propuesta"
compatibility_date = "2026-10-11"

[vars]
PAYMENTS_ENABLED = "false"

[env.preview.vars]
PAYMENTS_ENABLED = "false"

# Antes de habilitar pagos se debe configurar CHECKOUT_SITE_URL con el origen
# HTTPS real. Las rutas de retorno tienen valores predeterminados documentados
# en PAGOS.md y también pueden definirse como variables del entorno.
# MP_ACCESS_TOKEN, MP_WEBHOOK_SECRET, ORDER_TOKEN_SECRET, MP_APPLICATION_ID,
# MP_USER_ID y MP_TEST_PAYER_EMAIL se configuran como secretos/variables del
# entorno de prueba, nunca aquí.
# MP_LIVE_MODE debe permanecer en "false" mientras se usen usuarios de prueba.

# El entorno payments-test permanece en biodigital-propuesta y no se publica
# con este archivo. Ver MIGRACION-SITIO.md. No enlazar su D1 a este proyecto.
