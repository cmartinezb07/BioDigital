<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartel con código QR · Bío Digital</title>
<meta name="description" content="Cartel con código QR para imprimir o compartir: lleva a la reserva, la carta o la tarjeta de fidelización del local.">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap">
<style>
  :root { --c: #2f6f4e; color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Inter, system-ui, sans-serif; background: #eef0f3; color: #111827; }
  .barra { max-width: 760px; margin: 0 auto; padding: 16px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .barra label { display: grid; gap: 4px; font-size: 13px; color: #4b5563; flex: 1 1 200px; }
  .barra input { font: inherit; padding: 9px 11px; border: 1px solid #d1d5db; border-radius: 10px; min-height: 44px; }
  .btn { font: inherit; font-weight: 600; min-height: 44px; padding: 10px 16px; border-radius: 999px; border: 1px solid #d1d5db; background: #fff; cursor: pointer; }
  .btn.prim { background: var(--c); color: #fff; border-color: var(--c); }
  .hoja { width: min(560px, calc(100vw - 32px)); aspect-ratio: 1 / 1.414; margin: 8px auto 32px; background: #fff; border-radius: 18px; box-shadow: 0 20px 50px -30px rgba(0,0,0,.4);
    display: grid; grid-template-rows: auto 1fr auto; padding: 7%; text-align: center; border-top: 14px solid var(--c); }
  .hoja h1 { margin: 0; font-size: clamp(26px, 7vw, 40px); line-height: 1.1; letter-spacing: -.02em; }
  .hoja .sub { margin: 10px 0 0; font-size: clamp(16px, 4vw, 21px); color: #374151; }
  .qr { display: grid; place-items: center; padding: 6% 0; }
  .qr canvas, .qr img { width: min(72%, 330px) !important; height: auto !important; image-rendering: pixelated; }
  .pie b { display: block; font-size: clamp(17px, 4.4vw, 22px); color: var(--c); }
  .pie small { display: block; margin-top: 6px; color: #6b7280; word-break: break-all; font-size: 12px; }
  .err { max-width: 560px; margin: 24px auto; padding: 16px; background: #fff; border-radius: 12px; }
  @media print { body { background: #fff; } .barra { display: none; } .hoja { box-shadow: none; width: 100%; margin: 0; border-radius: 0; } @page { size: A4; margin: 12mm; } }
</style>
</head>
<body>
<!-- Uso: cartel.html?url=https://…&titulo=Reserva tu hora&sub=Salón Brillo&color=%23b8437a  (todo se arma en este navegador: no se guarda nada) -->
<div class="barra" aria-label="Opciones del cartel">
  <label>Título <input id="c-tit" maxlength="40"></label>
  <label>Nombre del local <input id="c-sub" maxlength="60"></label>
  <button class="btn" type="button" id="c-png">Descargar imagen</button>
  <button class="btn prim" type="button" id="c-imp">Imprimir</button>
</div>
<main id="cartel"></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" integrity="sha384-3zSEDfvllQohrq0PHL1fOXJuC/jSOO34H46t6UQfobFOmxE5BpjjaIJY5F2/bMnU" crossorigin="anonymous"></script>
<script src="cartel.js?v=60fad1bd"></script>
</body>
</html>
